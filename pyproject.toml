[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-reliability-toolkit"
version = "0.1.0"
description = "Config-driven data reliability gate: quality checks, schema drift, reconciliation, circuit breaker, incident notes."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vijaya Lakshmi Kompalli" }]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "PyYAML>=6.0"]

[project.optional-dependencies]
bedrock = ["boto3"]
azure = ["openai"]

[project.scripts]
reliability = "reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608"]  # asserts in tests; SQL is built from validated/quoted identifiers

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
